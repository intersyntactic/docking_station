name: is_admission_vocabulary
description: >-
  What other parts of intersyntactic import to speak with the docking
  station: the readings a module gives it, the admission decisions it
  records, and how both are encoded in the logbook.
version: 0.1.0
repository: https://github.com/intersyntactic/docking_station/tree/main/admission_vocabulary

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.3.2
  is_conversation_shapes: ^0.8.3
  # path_start.dart takes ObjectId from here, never the client, so the
  # airlock that imports it reaches no socket code.
  is_logbook: ^0.2.1
  is_logbook_client: ^0.2.0
  is_shapes: ^0.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
