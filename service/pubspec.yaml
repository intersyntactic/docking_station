name: docking_station_service
description: >-
  The docking station run as a service: it reads the record through the
  logbook's read socket and sends each decision through its write socket.
version: 0.2.0
repository: https://github.com/intersyntactic/docking_station
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_admission_vocabulary: ^0.1.0
  is_conversation_shapes: ^0.8.3
  is_flight_rules: ^0.3.0
  is_logbook_client: ^0.2.0
  is_shapes: ^0.6.0
  is_teams_module:
    git:
      url: https://github.com/intersyntactic/teams_module.git
      ref: cfd90cd

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
