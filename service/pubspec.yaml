name: docking_station_service
description: >-
  The docking station run as a service: it reads the logbook through its
  read socket and sends each decision through its write socket.
version: 0.12.0
repository: https://github.com/intersyntactic/docking_station
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.4.0
  is_docking_station_api: ^0.11.0
  is_conversation_vocabulary: ^0.2.0
  is_flight_rules: ^0.12.0
  is_logbook_client: ^0.4.0
  is_shapes: ^0.6.0
  is_teams_module:
    git:
      url: https://github.com/intersyntactic/teams_module.git
      ref: e8f77747bb394e714b602cdd1e3675334174048b
  is_whatsapp_module:
    git:
      url: https://github.com/intersyntactic/whatsapp_module.git
      ref: 5e639e1100a7ad11479b048819b701e606e9cb68

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
