name: is_docking_station_api
description: >-
  The docking station's contract: what other parts of intersyntactic import
  to speak with it. The events a module translates for it, the decisions
  it records, and how both are encoded in the logbook.
version: 0.8.0
repository: https://github.com/intersyntactic/docking_station/tree/main/docking_station_api

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.3.2
  # path_start.dart takes ObjectId from here alone, so the airlock that
  # imports it reaches no logbook code at all.
  is_content_id: ^0.2.0
  is_conversation_shapes: ^0.8.3
  is_logbook_format: ^0.1.0
  is_shapes: ^0.6.0
  # Where replies go, declared there alone, so every package shares one type.
  is_conversation_reply_vocabulary: ^0.1.0

dev_dependencies:
  is_web_address_vocabulary: ^0.1.2
  lints: ^6.1.0
  test: ^1.33.0
