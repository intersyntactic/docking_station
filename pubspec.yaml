name: is_docking_station
description: >-
  The docking station, a core piece of intersyntactic: it reads events from
  the record in order and decides whether each one is admitted to a
  mission, and on which trajectory.
version: 0.3.0
repository: https://github.com/intersyntactic/docking_station

environment:
  sdk: ^3.13.0

publish_to: none

dependencies:
  checked_json: ^0.2.1
  # Until the engine moves into the service and this package is deleted.
  is_admission_vocabulary:
    path: admission_vocabulary
  is_conversation_shapes: ^0.8.3
  is_logbook_client: ^0.2.0
  is_shapes: ^0.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
